﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fb">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="鼠仓">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>鼠仓 MouseKeeper · 交互原型（依据 PRD v0.4）</title>
<style>
:root{--ink:#1a2332;--sub:#5a6b80;--line:#e3e8ef;--bg:#f6f8fb;--brand:#2f6fed;--brand-soft:#eaf1fe;
--warn:#c0392b;--warn-soft:#fdecea;--ok:#1e8e5a;--ok-soft:#e7f6ef;--amber:#b97d10;--amber-soft:#fdf3e0;
--card:#fff;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;font-size:14px;}
.app{display:grid;grid-template-columns:216px 1fr;height:100vh;}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;overflow-y:auto;}
.side .logo{font-weight:700;font-size:17px;}
.side .ver{font-size:11.5px;color:var(--sub);margin:2px 0 18px;}
.side a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px;margin:2px 0;cursor:pointer;}
.side a:hover{background:var(--brand-soft);}
.side a.on{background:var(--brand);color:#fff;font-weight:600;}
.side a .fr{font-size:10.5px;color:var(--sub);font-family:var(--mono);}
.side a.on .fr{color:#dbe6ff;}
.badge{background:var(--warn);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:0 7px;line-height:17px;min-width:17px;text-align:center;}
.side a.on .badge{background:#fff;color:var(--brand);}
.side .foot{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--sub);}
.main{display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.topbar .tb-title{font-weight:700;font-size:15px;}
.topbar .tb-right{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sub);}
.topbar select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12.5px;background:#fff;}
.view{flex:1;overflow-y:auto;padding:26px 32px 90px;}
.pagehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.pagehead h1{font-size:21px;}
.frtag{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:2px 8px;}
.pagedesc{color:var(--sub);font-size:12.5px;margin-bottom:18px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid2>.card{margin:0;}
.card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card h3 .rt{margin-left:auto;font-size:11px;color:var(--sub);font-weight:400;}
.mut{color:var(--sub);}
.small{font-size:12px;}
.smaller{font-size:11.5px;}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:12.5px;background:var(--card);}
th{background:#eef2f7;text-align:left;padding:7px 10px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr.clickrow{cursor:pointer;} tr.clickrow:hover td{background:var(--brand-soft);}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:20px;white-space:nowrap;}
.tag.p0{background:var(--brand-soft);color:var(--brand);}
.tag.amber{background:var(--amber-soft);color:var(--amber);}
.tag.red{background:var(--warn-soft);color:var(--warn);}
.tag.ok{background:var(--ok-soft);color:var(--ok);}
.tag.gray{background:#eceff3;color:var(--sub);}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:12px;background:#eef2f7;margin:1px 2px;white-space:nowrap;cursor:default;}
.chip.m{background:var(--brand-soft);color:var(--brand);font-weight:600;}
.chip.f{background:#fdeef6;color:#c2437f;font-weight:600;}
.chip.id{font-family:var(--mono);cursor:pointer;}
.chip.id:hover{outline:1.5px solid var(--brand);}
.banner{padding:7px 12px;border-radius:8px;font-size:12px;margin:8px 0;}
.b-amber{background:var(--amber-soft);color:var(--amber);}
.b-red{background:var(--warn-soft);color:var(--warn);}
.b-blue{background:var(--brand-soft);color:var(--brand);}
.b-ok{background:var(--ok-soft);color:var(--ok);}
.btn{display:inline-block;border:1px solid var(--brand);color:var(--brand);background:#fff;padding:5px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;margin:3px 4px 3px 0;}
.btn:hover{background:var(--brand-soft);}
.btn.primary{background:var(--brand);color:#fff;}
.btn.primary:hover{background:#245cc9;}
.btn.danger{border-color:var(--warn);color:var(--warn);}
.btn.danger:hover{background:var(--warn-soft);}
.btn.ghost{border-color:var(--line);color:var(--sub);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.block{display:block;width:100%;text-align:center;margin-top:10px;}
.choice{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;}
.choice button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:5px 13px;font-size:12.5px;cursor:pointer;color:var(--ink);}
.choice button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600;}
.choice.danger button.on{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);}
.lbl{font-size:11.5px;color:var(--sub);font-weight:600;margin:10px 0 2px;display:block;}
.field .val{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fafbfc;font-size:12.5px;display:inline-block;}
.radio-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer;flex-wrap:wrap;}
.radio-row.on{border-color:var(--brand);background:var(--brand-soft);}
.radio-row.red.on{border-color:var(--warn);background:var(--warn-soft);}
.timeline{font-size:12px;margin-top:8px;}
.tl-item{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:7px;flex-shrink:0;}
.tl-dot.amber{background:var(--amber);} .tl-dot.ok{background:var(--ok);} .tl-dot.red{background:var(--warn);} .tl-dot.gray{background:#dfe3e8;}
.rack{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:14px 0;max-width:620px;}
.cell{aspect-ratio:1.5;border:1.5px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:all .15s;background:#fff;user-select:none;}
.cell:hover{border-color:var(--brand);}
.cell.occ{border-color:var(--brand);background:var(--brand-soft);}
.cell.warn-cell{border-color:var(--amber);background:var(--amber-soft);}
.cell.sel{outline:2px solid var(--brand);outline-offset:1px;}
.cell.pulse{border-style:dashed;border-color:var(--brand);animation:pu 1s infinite;}
@keyframes pu{50%{background:var(--brand-soft);}}
.cell .cid{font-weight:700;font-size:12px;}
.cell .cnt{color:var(--sub);font-size:10.5px;}
.cell .cname{font-size:9.5px;color:var(--brand);font-weight:600;max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15;}
.bar{height:10px;background:#eef2f7;border-radius:5px;overflow:hidden;margin:4px 0;}
.bar>i{display:block;height:10px;border-radius:5px;background:var(--brand);}
.bar>i.amber{background:var(--amber);} .bar>i.gray{background:#8aa6c8;}
.todo-item{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 14px;margin:8px 0;}
.todo-item.tone-red{border-color:var(--warn);background:var(--warn-soft);}
.todo-item.tone-amber{border-color:var(--amber);background:var(--amber-soft);}
.todo-item.tone-dim{opacity:.72;background:#fafbfc;}
.todo-item .t-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;}
.modal-mask{position:fixed;inset:0;background:rgba(26,35,50,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:#fff;border-radius:14px;max-width:660px;width:100%;max-height:88vh;overflow-y:auto;padding:20px 22px;box-shadow:0 16px 48px rgba(26,35,50,.2);}
.modal .m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.modal .m-close{cursor:pointer;color:var(--sub);font-size:18px;line-height:1;padding:2px 6px;}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:24px;font-size:12.5px;z-index:99;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:80vw;}
#toast.show{display:block;}
.cam{border:1.5px dashed var(--brand);border-radius:12px;background:var(--brand-soft);padding:22px 10px;text-align:center;color:var(--brand);font-size:12.5px;margin-bottom:12px;}
.cam .big{font-size:30px;line-height:1.2;}
.scanrow{display:flex;gap:6px;margin:8px 0;}
.scanrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:var(--mono);}
.ped-node{display:inline-block;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px;font-size:12px;background:#fff;text-align:center;min-width:96px;}
.ped-node.center{border-color:var(--brand);outline:2px solid var(--brand-soft);}
.ped-node .sex{font-weight:700;} .ped-node .sex.m{color:var(--brand);} .ped-node .sex.f{color:#c2437f;}
.ped-line{text-align:center;color:var(--sub);font-size:15px;line-height:1.1;}
.geno{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:4px;font-weight:700;}
.geno.pos{background:var(--ok-soft);color:var(--ok);}
.geno.neg{background:#eef2f7;color:var(--sub);}
.geno.pend{background:var(--amber-soft);color:var(--amber);}
.gcell{cursor:pointer;} .gcell:hover{outline:1.5px solid var(--brand);}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:12.5px;margin:8px 0;}
.kv .k{color:var(--sub);}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin:6px 0;flex-wrap:wrap;}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);vertical-align:-2px;margin-right:4px;}
.legend .l1 i{border-color:var(--brand);background:var(--brand-soft);}
.legend .l2 i{border-color:var(--amber);background:var(--amber-soft);}
.racktabs{display:flex;gap:6px;margin:4px 0 2px;}
.racktabs button{border:1.5px solid var(--line);background:#fff;border-radius:8px 8px 0 0;padding:5px 16px;font-size:12.5px;cursor:pointer;color:var(--sub);}
.racktabs button.on{border-color:var(--brand);color:var(--brand);font-weight:700;border-bottom:2px solid var(--brand);}
.photo-ph{border:1.5px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--sub);font-size:12px;cursor:pointer;margin-top:8px;}
.demo-note{border-left:3px solid var(--brand);background:var(--brand-soft);padding:9px 13px;border-radius:0 8px 8px 0;font-size:12px;margin:10px 0;}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;}
.strip .st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:12px;color:var(--sub);}
.strip .st b{font-size:17px;color:var(--ink);margin-right:5px;font-family:var(--mono);}
input[type=text],input[type=date],select.pg{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;}
/* ===== 移动端适配（桌面端样式完全不变） ===== */
.hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:17px;line-height:1;padding:6px 11px;cursor:pointer;color:var(--ink);}
.side-mask{display:none;position:fixed;inset:0;background:rgba(26,35,50,.45);z-index:55;}
@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto;min-height:100vh;}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(78vw,300px);z-index:60;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.18);padding-bottom:calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain;}
  body.menu-open .side{transform:translateX(0);}
  body.menu-open{overflow:hidden;}
  body:has(.modal-mask){overflow:hidden;}
  .side-mask{display:block;opacity:0;pointer-events:none;transition:opacity .25s;}
  body.menu-open .side-mask{opacity:1;pointer-events:auto;}
  .hamb{display:inline-block;flex-shrink:0;}
  /* 顶栏：汉堡 + 标题一行，操作人控件紧凑不换行 */
  .topbar{padding:8px 10px;gap:8px;flex-wrap:nowrap;align-items:center;position:sticky;top:0;z-index:40;}
  .topbar .tb-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .topbar .tb-right{display:flex;flex-wrap:nowrap;gap:4px;font-size:12px;align-items:center;flex-shrink:0;}
  .topbar .tb-right>span:first-child{display:none;}
  .topbar .tb-right .smaller{display:none;}
  .topbar select{max-width:120px;font-size:12px;padding:3px 6px;}
  .topbar .btn.ghost{padding:3px 8px;font-size:13px;}
  .view{padding:14px 12px calc(90px + env(safe-area-inset-bottom));overflow-y:visible;}
  .pagehead h1{font-size:18px;}
  .grid2{grid-template-columns:1fr;}
  .grid2>.card{margin-bottom:16px;}
  .card{padding:14px 13px;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
  /* 表格：表头不换行，整体可横向滚动；字号加大提升手机可读性 */
  table{min-width:max-content;font-size:13.5px;}
  th{white-space:nowrap;}
  th,td{padding:7px 9px;}
  .tag{font-size:11px;}
  .chip{font-size:11.5px;}
  .strip{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;flex-wrap:nowrap;}
  .strip .st{padding:6px 12px;font-size:11.5px;flex-shrink:0;}
  .strip .st b{font-size:15px;}
  .rack{grid-template-columns:repeat(4,1fr);max-width:none;gap:5px;}
  .racktabs button{white-space:nowrap;padding:6px 12px;}
  .kv{grid-template-columns:86px 1fr;}
  /* 搜索行：输入框优先占满，选择器/按钮自动换行 */
  .scanrow{flex-wrap:wrap;gap:6px;}
  .scanrow input{flex:1 1 140px;min-width:0;}
  .scanrow select{flex:0 0 auto;min-width:70px;}
  .scanrow .btn{flex:0 0 auto;}
  input,select,textarea{font-size:16px !important;}
  input[type=checkbox]{width:20px;height:20px;}
  .btn{padding:8px 14px;font-size:13px;}
  .choice button{padding:8px 14px;}
  .radio-row{padding:10px;}
  .cell{min-height:54px;padding:4px;}
  .cell .cid{font-size:12px;}
  .cell .cnt{font-size:10px;text-align:center;line-height:1.2;}
  .cell .cname{font-size:10px;}
  .cell,.btn,.choice button,.radio-row,.side a,.gcell,.clickrow,.chip.id,.m-close{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .modal-mask{padding:0;align-items:flex-end;}
  .modal{border-radius:16px 16px 0 0;max-width:none;max-height:92vh;padding:18px 16px calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain;}
  .modal .m-head{position:sticky;top:-18px;background:#fff;padding:6px 0;margin:0 0 8px;z-index:2;}
  #toast{bottom:calc(20px + env(safe-area-inset-bottom));max-width:92vw;}
  .ped-node{min-width:88px;}
  /* 档案详情页：谱系树横向滚动 */
  .ped-tree-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
}
/* 超小屏（≤380px，如 iPhone SE/mini 竖屏）紧凑补丁 */
@media (max-width:380px){
  .view{padding:12px 10px calc(90px + env(safe-area-inset-bottom));}
  .rack{gap:4px;}
  .cell{min-height:48px;}
  .cell .cid{font-size:11px;}
  .cell .cnt{font-size:9.5px;}
  .cell .cname{font-size:9.5px;}
  .strip .st{padding:5px 10px;}
  .topbar select{max-width:100px;}
}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="logo">🐭 鼠仓 MouseKeeper</div>
    <div class="ver">交互原型 · 依据 PRD v0.4</div>
    <a data-p="home" onclick="nav('home')">首页待办 <span class="fr">FR-6</span><span class="badge" id="todoBadge">0</span></a>
    <a data-p="board" onclick="nav('board')">笼位看板 <span class="fr">FR-1</span></a>
    <a data-p="scan" onclick="nav('scan')">工作台 <span class="fr">FR-3</span></a>
    <a data-p="arch" onclick="nav('arch')">档案与谱系 <span class="fr">FR-2/4</span></a>
    <a data-p="geno" onclick="nav('geno')">基因型鉴定 <span class="fr">FR-5</span></a>
    <a data-p="plans" onclick="nav('plans')">实验计划 <span class="fr">FR-7</span></a>
    <a data-p="stats" onclick="nav('stats')">存活统计 <span class="fr">FR-10</span></a>
    <a data-p="_share" onclick="shareOpen()">分享 / 导入 <span class="fr">数据</span></a>
    <div class="foot">无权限限制：角色仅用于<br>留痕与待办路由（PRD 3.1）</div>
  </div>
  <div class="main">
    <div class="topbar">
      <button class="hamb" onclick="document.body.classList.toggle('menu-open')" aria-label="菜单">☰</button>
      <div class="tb-title" id="tbTitle">首页待办</div>
      <div class="tb-right">
        <span>当前操作人</span>
        <select id="userSel" onchange="setUser(this.value)"></select>
        <button class="btn ghost" style="padding:2px 8px;" onclick="newUser()" title="注册新操作人">＋</button>
        <button class="btn ghost" style="padding:2px 8px;" onclick="delUser()" title="删除当前操作人">−</button>
        <span class="smaller">切换仅影响留痕姓名</span>
      </div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>
<div class="side-mask" onclick="document.body.classList.remove('menu-open')"></div>

<script>
/* ================= 基础数据（锚点对齐 PRD v0.4） ================= */
const TODAY='2026-10-18', NOWT='10:15';
const ROWS=['A','B','C','D','E'];
const PLANS={};
const PLAN_OWNER={};
const USERS=['王同学'];
let idSeq=1; const nid=()=>'MK-2026-0'+String(idSeq++).padStart(3,'0');

const M={}; // mice
function addMouse(o){
  M[o.id]=Object.assign({sex:'♀',strain:'C57BL/6J',birth:'2026-05-10',geno:'WT',cage:null,plan:null,
    status:'active',source:'本室繁育',fa:null,mo:null,events:[]},o);
  if(!M[o.id].events.length) M[o.id].events=[{t:'建档 · '+TODAY,who:'系统',text:'初始建档',cls:''}];
}

// 存活统计动态化：初始已鉴定且有谱系的鼠视为已计入 ident 基线，动态统计时不重复叠加
const IDENT_BASE=new Set(Object.values(M).filter(m=>m.fa&&m.mo&&m.geno&&m.geno!=='待鉴定'&&m.geno!=='无效').map(m=>m.id));
function genoClass(g){
  if(!g||g==='待鉴定'||g==='无效'||g==='待录入')return null;
  if(g==='WT')return 'WT';
  if(g==='H')return 'HE';
  // 兼容合并前的旧基因型字符串（CreH; flox/H、flox/flox、CreWT 等）
  if(g.indexOf('CreH')>=0)return 'HE';
  if(g.indexOf('WT')>=0)return 'WT';
  return 'HE';
}
function pairOffspring(p){

/* ================= 数据持久化（localStorage） =================
   所有业务数据均为 const 声明的内存结构，采用「清空键+逐键赋值」方式写回，
   在 render() 末尾统一调用 saveData()，任何操作后自动落盘 */
const LS_KEY='mousekeeper-data-v1';
function saveData(){
 try{
  const snap={PLANS,PLAN_OWNER,USERS,idSeq,M,CAGES,CAGE_NAMES,PAIRS,LITTERS,DEATHS,deathSeq,todoSeq,TODOS,OPLOG,BATCHES,litterSeq,IDENT_BASE:Array.from(IDENT_BASE)};
  localStorage.setItem(LS_KEY,JSON.stringify(snap));
 }catch(e){/* 存储不可用或超限时静默跳过，不影响当前使用 */}
}
function loadData(){
 try{
  const raw=localStorage.getItem(LS_KEY);if(!raw)return;
  const s=JSON.parse(raw);
  [['PLANS',PLANS],['PLAN_OWNER',PLAN_OWNER],['M',M],['CAGES',CAGES],['CAGE_NAMES',CAGE_NAMES],['PAIRS',PAIRS],['LITTERS',LITTERS]].forEach(function(pair){
   Object.keys(pair[1]).forEach(k=>delete pair[1][k]);
   Object.keys(s[pair[0]]||{}).forEach(k=>pair[1][k]=s[pair[0]][k]);
  });
  // 兼容旧版本：笼名此前存在笼对象上，迁移到独立映射（笼子移除/清空后不再丢失）
  Object.keys(CAGES).forEach(p=>{
   if(CAGES[p].name){if(!CAGE_NAMES[p])CAGE_NAMES[p]=CAGES[p].name;delete CAGES[p].name;}
  });
  [['USERS',USERS],['DEATHS',DEATHS],['TODOS',TODOS],['OPLOG',OPLOG],['BATCHES',BATCHES]].forEach(function(pair){
   pair[1].length=0;(s[pair[0]]||[]).forEach(v=>pair[1].push(v));
  });
  if(!USERS.length)USERS.push('王同学');
  // 兼容合并前的旧数据：送检批 Cre/flox 双列 → 单一基因型列（H / WT / 无效 / 待录入）
  BATCHES.forEach(b=>(b.rows||[]).forEach(r=>{
   if(r.geno===undefined){
    if(r.cre==='无效'||r.flox==='无效')r.geno='无效';
    else if(!r.cre||r.cre==='待录入'||!r.flox||r.flox==='待录入')r.geno='待录入';
    else r.geno=(r.cre==='+'||r.flox==='flox/+'||r.flox==='flox/flox')?'H':'WT';
    delete r.cre;delete r.flox;
   }
  }));
  // 兼容合并前的旧基因型字符串（CreH; flox/H、CreWT; WT 等）→ H / WT
  Object.values(M).forEach(m=>{
   const g=m.geno;
   if(!g||g==='待鉴定'||g==='无效'||g==='待录入'||g==='H'||g==='WT')return;
   const cls=genoClass(g);m.geno=cls==='WT'?'WT':cls==='HE'?'H':g;
  });
  // 恢复操作人：保存的用户必须在 USERS 中，否则回退到首个；无有效用户则保持未登录态
  const sav=s.ui||{};
  ui.user=(sav.user&&USERS.includes(sav.user))?sav.user:USERS[0]||null;
  ui.loggedIn=!!(ui.user&&USERS.includes(ui.user));
  idSeq=s.idSeq||1;deathSeq=s.deathSeq||1;todoSeq=s.todoSeq||1;litterSeq=s.litterSeq||1;
  IDENT_BASE.clear();(s.IDENT_BASE||[]).forEach(id=>IDENT_BASE.add(id));
 }catch(e){/* 数据损坏时忽略，从空状态启动 */}
}

  snap=o;
 }catch(e){toast('⛔ 分享码无效或已损坏');return;}
 const vMsg=snap.v===SHARE_VER?'数据版本 v'+snap.v+'（与当前一致）':'数据版本 v'+snap.v+'（低于当前 v'+SHARE_VER+'，将按兼容模式导入）';
 // 导入前先兜底导出当前快照
 let backup='';try{backup=btoa(unescape(encodeURIComponent(JSON.stringify(shareSnapshot()))));}catch(e){}
 if(!confirm('导入将完全覆盖当前所有数据（鼠 / 笼位 / 终态 / 计划 / 待办 / 日志），确认导入？\n\n'+vMsg+(snap.at?' · 快照生成于 '+snap.at:'')+'\n\n当前快照备份码（可先复制保存）：\n'+backup.slice(0,120)+'…\n\n点「确定」开始导入。'))return;
 try{ shareImportRun(snap); }catch(e){ ui.wiz=null;renderModal();toast('⛔ 导入启动失败：'+e.message+'，数据未被改动'); }

function shareImportRun(snap){
 const steps=[
  ['校验快照结构',()=>{idSeq=snap.idSeq;todoSeq=snap.todoSeq;litterSeq=snap.litterSeq;}],
  ['导入鼠档案（'+Object.keys(snap.M).length+' 只）',()=>{Object.keys(M).forEach(k=>delete M[k]);Object.keys(snap.M).forEach(k=>M[k]=snap.M[k]);}],
  ['导入笼位（'+Object.keys(snap.CAGES).length+' 个 / 自定义笼名 '+Object.keys(snap.CAGE_NAMES||{}).length+' 个）',()=>{
   Object.keys(CAGES).forEach(k=>delete CAGES[k]);Object.keys(snap.CAGES).forEach(k=>CAGES[k]=snap.CAGES[k]);
   Object.keys(CAGE_NAMES).forEach(k=>delete CAGE_NAMES[k]);Object.keys(snap.CAGE_NAMES||{}).forEach(k=>CAGE_NAMES[k]=snap.CAGE_NAMES[k]);
   // 兼容旧分享码：笼名存在笼对象上 → 迁移到独立映射
   Object.keys(CAGES).forEach(p=>{if(CAGES[p].name){if(!CAGE_NAMES[p])CAGE_NAMES[p]=CAGES[p].name;delete CAGES[p].name;}});}],
  ['导入终态记录（'+snap.DEATHS.length+' 条）',()=>{DEATHS.length=0;snap.DEATHS.forEach(r=>DEATHS.push(r));}],
  ['导入实验计划 / 繁育谱系',()=>{
   Object.keys(PLANS).forEach(k=>delete PLANS[k]);Object.keys(snap.PLANS).forEach(k=>PLANS[k]=snap.PLANS[k]);
   Object.keys(PLAN_OWNER).forEach(k=>delete PLAN_OWNER[k]);Object.keys(snap.PLAN_OWNER||{}).forEach(k=>PLAN_OWNER[k]=snap.PLAN_OWNER[k]);
   Object.keys(PAIRS).forEach(k=>delete PAIRS[k]);Object.keys(snap.PAIRS||{}).forEach(k=>PAIRS[k]=snap.PAIRS[k]);
   Object.keys(LITTERS).forEach(k=>delete LITTERS[k]);Object.keys(snap.LITTERS||{}).forEach(k=>LITTERS[k]=snap.LITTERS[k]);}],
  ['导入待办 / 送检批',()=>{
   TODOS.length=0;(snap.TODOS||[]).forEach(r=>TODOS.push(r));
   BATCHES.length=0;(snap.BATCHES||[]).forEach(r=>BATCHES.push(r));}],
  ['导入操作人与日志',()=>{
   OPLOG.length=0;(snap.OPLOG||[]).forEach(r=>OPLOG.push(r));
   USERS.length=0;(snap.USERS||['王同学']).forEach(u=>USERS.push(u));
   ui.user=(snap.ui&&snap.ui.user&&USERS.includes(snap.ui.user))?snap.ui.user:(USERS[0]||null);
   ui.rack=(snap.ui&&snap.ui.rack)||'R1';
   ui.loggedIn=!!(ui.user&&USERS.includes(ui.user));}],
  ['完成',null]
 ];
 ui.wiz={step:'shareProg',snap:snap,steps:steps,i:0,pct:0};
 renderModal();
 shareImportTick();
}

  OPLOG.unshift({t:NOWT,text:'导入分享码快照（鼠 '+Object.keys(M).length+' 只 · 终态 '+DEATHS.length+' 条 · 待办 '+activeTodos().length+' 未完成） · '+ui.user});

  renderModal();render();toast('✓ 快照已导入 · 全部页面已切换到导入数据');

 }
 const st=w.steps[w.i];
 w.label=st[0];
 try{ if(st[1])st[1](); }catch(e){ clearTimeout(ui._shareTimer);ui._shareTimer=null;ui.wiz=null;renderModal();toast('⛔ 导入中断：'+st[0]+' 失败（'+e.message+'），数据可能不完整，请刷新重置');return; }
 w.i++;w.pct=Math.round(w.i/w.steps.length*100);
 renderModal();
 ui._shareTimer=setTimeout(shareImportTick,140);
}

 +'<b>'+t.title+'</b> <span class="tag '+(t.due.indexOf('今天')===0||t.due.indexOf('剩')===0?'red':'gray')+'">'+t.due+'</span></div>'
 +'<div class="smaller mut">'+t.detail+'</div></div>';
 if(t.type==='归因'){
  const rec=t.recRef,rid=DEATHS.indexOf(rec);
  h+='<div><button class="btn primary" onclick="ui.attrOpen=!(ui.attrOpen);render()">去归因确认</button></div>';
  if(ui.attrOpen&&rec&&!rec.revoked)h+=attrPanel(rec,rid);
 }
 if(t.type==='断乳'&&t.litter)h+='<div><button class="btn primary" onclick="todoAct(\''+t.id+'\',\'wean\')">执行断乳分笼（生成仔鼠档案并移入新笼）</button></div>';
 if(t.type==='鉴定')h+='<div><button class="btn" onclick="nav(\'geno\')">去基因型鉴定</button><button class="btn ghost" onclick="nav(\'arch\')">查看档案</button></div>';
 return h+'</div>';
}
function attrPanel(rec,rid){
 return '<div class="card" style="margin-top:10px;background:#fbfcfe;">'
 +'<b>死亡归因确认 · '+rec.sex+' '+rec.mid+'</b> <span class="tag amber">初判-待确认</span>'
 +'<div class="timeline"><div class="tl-item"><span class="tl-dot amber"></span><div>发现（快速登记）：'+rec.finder+' · '+rec.time+' · '+rec.scene+' · 初判「'+rec.initial+'」</div></div>'
 +'<div class="tl-item"><span class="tl-dot gray"></span><div class="mut">分配背景：2026-09-30 由'+(rec.plan?PLAN_OWNER[rec.plan]:'李同学')+'分配至'+(rec.plan?'计划「'+PLANS[rec.plan].name+'」':'PI 直接管理')+'</div></div></div>'
 +'<span class="lbl">确认正式死因（实验语义枚举）</span>'
 +['人道终点-发病','实验操作相关','环境/管理相关','其他（备注必填）'].map(c=>'<div class="radio-row red '+(ui.newReg['f'+rec.mid]===c?'on':'')+'" onclick="ui.newReg[\'f'+rec.mid+'\']=\''+c+'\';render()">'+c+'</div>').join('')
 +(ui.newReg['f'+rec.mid]==='其他（备注必填）'
   ?'<span class="lbl">备注（必填 · 请写明具体死因细节）</span><div class="scanrow"><input type="text" id="attrNote" value="'+esc(ui.newReg['n'+rec.mid]||'')+'" placeholder="如 采血后失血过多 / 互斗咬伤 / 原因不明需复核" oninput="ui.newReg[\'n'+rec.mid+'\']=this.value"></div>'
   +'<div class="small mut" style="margin-top:4px;">选择「其他」时备注为必填项，将随归因结论一并写入时间线与操作日志（只增不改）。</div>':'')
 +'<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">'
 +'<button class="btn danger" onclick="doAttr('+rid+')" '+(ui.newReg['f'+rec.mid]?'':'disabled')+'>提交归因确认</button>'
 +'<button class="btn ghost" onclick="undoDeath('+rid+')">疑似误判？当日撤销本次登记</button></div>'
 +'<div class="small mut" style="margin-top:8px;">超时规则：24h 再次提醒责任人 → 48h 升级至 PI。提交后时间线追加第二段（归因确认人），只增不改。</div></div>';
}
function doAttr(rid){
 const rec=DEATHS[rid];if(!rec||rec.revoked)return;
 const cause=ui.newReg['f'+rec.mid]||'人道终点-发病';
 let note='';
 if(cause.indexOf('其他')===0){
  note=(ui.newReg['n'+rec.mid]||'').trim();
  if(!note){toast('⛔ 选择「其他」时备注必填，请写明具体死因细节');return;}
 }
 rec.pending=false;rec.cause=cause;rec.attrNote=note;rec.confirmer=ui.user;
 TODOS.forEach(t=>{if(t.recRef===rec)t.done=true;});
 const m=M[rec.mid];if(m){m.deathPending=false;m.events.push({t:TODAY+' '+NOWT,who:ui.user,text:'归因确认 · 正式死因「'+cause+'」'+(note?'（备注：'+note+'）':''),cls:'red'});}
 OPLOG.unshift({t:NOWT,text:'死亡归因确认 '+rec.mid+' →「'+cause+'」'+(note?' · 备注：'+note:'')+' · '+ui.user});
 delete ui.newReg['n'+rec.mid];
 ui.attrOpen=false;render();toast('✓ 归因已确认 · 用量报表中该记录转为正式死因');
}

/* 归因确认 / 撤销（操作死亡记录） */
function undoDeath(rid){
 const rec=DEATHS[rid];
 if(!rec||rec.revoked){toast('该记录已撤销');return;}
 // 全死因开放撤回：快速登记 / 完整登记 / 已归因记录均可撤回（留痕）
 rec.revoked=true;
 const m=M[rec.mid];
 if(m){m.status='active';m.deathPending=false;m.plan=rec.plan||m.plan;
  let back=rec.cage&&CAGES[rec.cage]?rec.cage:firstEmpty();
  if(!CAGES[back])CAGES[back]={pos:back,kind:'普通',pairId:null,mice:[],pups:null};
  m.cage=back;CAGES[back].mice.push(m.id);
  m.events.push({t:TODAY+' '+NOWT,who:ui.user,text:'撤销死亡登记（误判复活）· 恢复在养 · 入笼 '+back+' · 时间线保留「登记→撤销」完整记录',cls:'ok'});}
 if(rec.plan)PLANS[rec.plan].used=Math.max(0,PLANS[rec.plan].used-1);
 TODOS.forEach(t=>{if(t.recRef===rec)t.done=true;});
 OPLOG.unshift({t:NOWT,text:'撤销死亡登记 '+rec.mid+'（当日撤销 · 留痕）· '+ui.user});
 ui.attrOpen=false;if(ui.wiz)ui.wiz=null;renderModal();render();toast('✓ 已撤销 · 鼠恢复在养并回笼 · 时间线完整保留');
}

/* 待办动作 */
function todoAct(id,act){
 const t=TODOS.find(x=>x.id===id);
 if(!t)return;
 if(t.type==='断乳'&&act==='wean')execWean(t.litter,t);
}
function execWean(lid,t){
 const L=LITTERS[lid];if(!L||L.weaned){toast('该窝已断乳');return;}
 const pos=firstEmpty();CAGES[pos]={pos,kind:'普通',pairId:null,mice:[],pups:null};
 const newIds=[];
 for(let i=0;i<L.count;i++){
  const id=nid();newIds.push(id);
  addMouse({id,sex:i%2?'♀':'♂',strain:L.strain,birth:L.birth,geno:'待鉴定',cage:pos,source:'本室繁育（'+lid+'）',
   fa:L.sire,mo:L.dam,events:[{t:TODAY+' '+NOWT,who:ui.user,text:'断乳建档（窝次 '+lid+'）· 入笼 '+pos,cls:''}]});
  CAGES[pos].mice.push(id);
 }
 L.weaned=true;
 const pc=CAGES[L.cage];if(pc)pc.pups=null;
 t.done=true;
 const bid='TB-2026-'+String(BATCHES.length+1).padStart(3,'0');
 TODOS.push({id:'t'+(todoSeq++),type:'鉴定',tone:'amber',title:'待鉴定 · 窝次 '+lid+' 仔鼠 '+L.count+' 只',detail:'断乳完成且基因型待鉴定 → 送检（FR-5）· 新笼 '+pos,due:'断乳完成时生成',batch:bid,done:false});
 BATCHES.push({id:bid,title:'送检批 · 基因型鉴定（窝次 '+lid+' 仔鼠，断乳后新建）',status:'结果回收 · 待录入',
  rows:newIds.map(id=>({mid:id,sex:M[id].sex,geno:'待录入',src:'窝次 '+lid,target:'—'}))});
 OPLOG.unshift({t:NOWT,text:'窝次 '+lid+' 断乳分笼：'+L.count+' 只建档入笼 '+pos+' · '+ui.user});
 render();toast('✓ 断乳完成：'+L.count+' 只档案已生成并入笼 '+pos+' · 已生成「待鉴定」待办与送检批');
}

function weanDate(b){const d=new Date(b);d.setDate(d.getDate()+21);
 const m=('0'+(d.getMonth()+1)).slice(-2);return TODAY.slice(0,4)+'-'+m+'-'+('0'+d.getDate()).slice(-2);}
function cellClick(pos){
 if(ui.moveFrom){if(!CAGES[pos])doMove(ui.moveFrom,pos);return;}
 if(ui.selPos!==pos)ui.moveSel=new Set(); // 切换笼格时清空多选，防跨笼残留
 ui.selPos=pos;render();
}
function boardMoveStart(pos){ui.moveFrom=pos;ui.selPos=pos;render();}
function doMove(from,to){
 CAGES[to]=CAGES[from];CAGES[to].pos=to;delete CAGES[from];
 CAGES[to].mice.forEach(id=>M[id].events.push({t:TODAY+' '+NOWT,who:ui.user,text:'笼位移动：'+from+' → '+to,cls:''}));
 OPLOG.unshift({t:NOWT,text:'笼 '+from+' 整体移动至 '+to+' · '+ui.user});
 ui.moveFrom=null;ui.selPos=to;render();toast('✓ 笼已移动至 '+to+' · 笼位历史已留痕');
}
function boardNewCage(pos){
 ui.wiz={step:'newCage',pos:pos,kind:'普通',sel:new Set()};renderModal();
}

 CAGES[pos]={pos,kind:'普通',pairId:null,mice:[a,b],pups:null};

function ncKind(k){ui.wiz.kind=k;renderModal();}
function ncToggle(id){const w=ui.wiz;if(w.sel.has(id))w.sel.delete(id);else w.sel.add(id);renderModal();}
function newCageSubmit(){
 const w=ui.wiz,pos=w.pos,ids=[...w.sel];
 if(!ids.length){toast('请至少选择 1 只鼠');return;}
 if(CAGES[pos]){toast('笼位已被占用');return;}
 CAGES[pos]={pos,kind:(w.kind==='繁殖'?'繁殖笼':'普通'),pairId:null,mice:[],pups:null};
 ids.forEach(id=>{
  const old=M[id].cage;
  if(old&&CAGES[old]){CAGES[old].mice=CAGES[old].mice.filter(x=>x!==id);if(!CAGES[old].mice.length&&!CAGES[old].pups)delete CAGES[old];}
  M[id].cage=pos;
  M[id].events.push({t:TODAY+' '+NOWT,who:ui.user,text:'移入新笼 '+pos+(old?'（自 '+old+' 移出）':'')+' · 笼型「'+w.kind+'」',cls:''});
  CAGES[pos].mice.push(id);
 });
 OPLOG.unshift({t:NOWT,text:'笼位 '+pos+' 放入新笼（'+w.kind+'）· 移入 '+ids.length+' 只：'+ids.join(' / ')+' · '+ui.user});
 ui.wiz=null;ui.selPos=pos;renderModal();render();toast('✓ 新笼 '+pos+' 已建立（'+w.kind+' · '+ids.length+' 只）');
}
/* 往已有笼加入老鼠 */
function boardAddMice(pos){
 const cg=CAGES[pos];if(!cg)return;
 if(cg.pups){toast('⛔ 本笼存在未断乳窝次，请先完成断乳分笼');return;}
 ui.wiz={step:'addMice',pos:pos,sel:new Set()};renderModal();
}
function addMiceSubmit(){
 const w=ui.wiz,pos=w.pos,ids=[...w.sel];
 if(!ids.length){toast('请至少选择 1 只鼠');return;}
 const cg=CAGES[pos];if(!cg){toast('笼位不存在');ui.wiz=null;renderModal();return;}
 if(cg.pups){toast('⛔ 本笼存在未断乳窝次，不可加入');ui.wiz=null;renderModal();return;}
 let moved=0;
 ids.forEach(id=>{
  const old=M[id].cage;
  if(old===pos)return;
  if(old&&CAGES[old]){CAGES[old].mice=CAGES[old].mice.filter(x=>x!==id);if(!CAGES[old].mice.length&&!CAGES[old].pups)delete CAGES[old];}
  M[id].cage=pos;
  M[id].events.push({t:TODAY+' '+NOWT,who:ui.user,text:'加入已有笼 '+pos+(old?'（自 '+old+' 移出）':''),cls:''});
  cg.mice.push(id);moved++;
 });
 OPLOG.unshift({t:NOWT,text:'笼位 '+pos+' 加入 '+moved+' 只：'+ids.join(' / ')+' · '+ui.user});
 ui.wiz=null;ui.selPos=pos;renderModal();render();toast('✓ 已加入 '+moved+' 只 → '+pos);
}
/* 笼型切换：普通笼 ↔ 繁殖笼 */
function boardToggleKind(pos){
 const cg=CAGES[pos];if(!cg)return;
 const to=cg.kind==='繁殖笼'?'普通':'繁殖笼';
 if(to==='普通'&&cg.pups){toast('⛔ 本笼存在未断乳窝次，不能转为普通笼');return;}
 cg.kind=to;
 cg.mice.forEach(id=>M[id].events.push({t:TODAY+' '+NOWT,who:ui.user,text:'笼型调整为「'+to+'笼」（笼位 '+pos+'）',cls:''}));
 OPLOG.unshift({t:NOWT,text:'笼位 '+pos+' 笼型调整为「'+to+'笼」 · '+ui.user});
 render();toast(to==='繁殖笼'?'✓ '+pos+' 已设为繁殖笼（可产仔登记）':'✓ '+pos+' 已转为普通笼');
}
/* 笼内老鼠多选移动：移入其他笼 / 退回档案待分配 */

function moveMiceOpen(pos){

 if(!ids.length){toast('请先勾选要移动的老鼠');return;}
 ui.wiz={step:'moveMice',pos:pos,dest:null};renderModal();
}
function moveMiceSubmit(){
 const w=ui.wiz,pos=w.pos,dest=w.dest;
 if(!dest){toast('请选择去向');return;}

/* 移除笼子：空笼直接移除；有鼠笼需先选择去向（移入他笼 / 退回档案待分配） */
function boardRemoveCage(pos){
 const cg=CAGES[pos];if(!cg)return;
 if(cg.pups){toast('⛔ 本笼存在未断乳窝次，请先完成断乳分笼');return;}
 if(!cg.mice.length){

  }
 }
 }
 h+='</div></div>';

/* 删除送检批 / 批内鼠记录（已分笼的行与批不可删除，保证落位数据一致） */
function delBatch(bid){
 const b=BATCHES.find(x=>x.id===bid);if(!b)return;
 if(b.rows.some(r=>r.moved)){toast('⛔ 该批存在已分笼记录，不可整批删除（可逐条移除未分笼行）');return;}
 if(!confirm('确认删除送检批 '+bid+'（'+b.rows.length+' 条记录）？\n仅删除送检记录，老鼠档案与笼位不受影响。'))return;
 BATCHES.splice(BATCHES.indexOf(b),1);
 b.rows.forEach(r=>ui.gsel.delete(r.mid));
 TODOS.forEach(t=>{if(t.batch===bid&&!t.done)t.done=true;});
 OPLOG.unshift({t:NOWT,text:'删除送检批 '+bid+'（'+b.rows.length+' 条）· '+ui.user});
 render();toast('✓ 送检批 '+bid+' 已删除');
}
function delBatchRow(bid,mid){
 const b=BATCHES.find(x=>x.id===bid);if(!b)return;
 const r=b.rows.find(r=>r.mid===mid);if(!r)return;
 if(r.moved){toast('⛔ 已分笼的记录不可删除');return;}
 if(!confirm('确认将 '+mid+' 从送检批 '+bid+' 移除？\n仅删除送检记录，老鼠档案不受影响。'))return;
 b.rows=b.rows.filter(x=>x.mid!==mid);
 ui.gsel.delete(mid);
 OPLOG.unshift({t:NOWT,text:'送检批 '+bid+' 移除记录 '+mid+' · '+ui.user});
 if(!b.rows.length){
  BATCHES.splice(BATCHES.indexOf(b),1);
  TODOS.forEach(t=>{if(t.batch===bid&&!t.done)t.done=true;});
  OPLOG.unshift({t:NOWT,text:'送检批 '+bid+' 已空，自动删除 · '+ui.user});
 }
 render();toast('✓ 已将 '+mid+' 移出送检批');
}

function gcell(mid,f){
 let b=BATCHES.find(b=>b.rows.some(r=>r.mid===mid));
 const r=b.rows.find(r=>r.mid===mid);
 const cyc=CYC.geno;let i=cyc.indexOf(r.geno);if(i<0)i=0;
 r.geno=cyc[(i+1)%cyc.length];
 const lab=genoLabel(r);
 if(M[mid]&&lab!=='待录入'){M[mid].geno=lab;}
 if(lab!=='无效'&&lab!=='待录入'){
  let closed=false;
  TODOS.forEach(t=>{if(t.type==='鉴定'&&t.mid===mid&&!t.done){t.done=true;closed=true;}});
  if(closed)toast('✓ 重新取样结果已录入 · 「待鉴定」待办自动关闭');
 }
 // 整批结果录入完毕 → 状态翻转为「待分笼」，并关闭关联的「待鉴定」待办（已分笼完成的批不回退状态）
 if(b&&b.rows.every(x=>genoLabel(x)!=='待录入')){
  if(b.status.indexOf('待分笼')<0&&b.status.indexOf('分笼完成')<0)b.status='结果回收 · 待分笼';
  TODOS.forEach(t=>{if(t.type==='鉴定'&&t.batch===b.id&&!t.done)t.done=true;});
 }
 render();
}

function gmoveSubmit(){
 const w=ui.wiz;
 const dest=w.dest==='auto'?null:w.dest;
 if(dest&&CAGES[dest]&&CAGES[dest].pups){toast('⛔ 目标笼存在未断乳窝次，不可移入');return;}
 const bid=w.bid;
 ui.wiz=null;renderModal();
 gmove(bid,dest);
}
function gmove(bid,dest){
 const b=BATCHES.find(x=>x.id===bid);
 const ids=[...ui.gsel].filter(mid=>{
  const r=b?b.rows.find(r=>r.mid===mid):null;
  return M[mid]&&!(r&&r.moved); // 幂等：已分笼的行跳过，防止重复移入
 });
 if(!ids.length){ui.gsel.clear();render();return;}
 ids.forEach(mid=>{
  const m=M[mid];
  const r=b?b.rows.find(r=>r.mid===mid):null;
  let to=dest||(r&&r.target&&r.target!=='—'&&r.target!=='待重取'?r.target:firstEmpty());
  if(m.cage&&CAGES[m.cage])CAGES[m.cage].mice=CAGES[m.cage].mice.filter(x=>x!==mid);
  if(!CAGES[to])CAGES[to]={pos:to,kind:'普通',pairId:null,mice:[],pups:null};
  CAGES[to].mice.push(mid);m.cage=to;
  m.events.push({t:TODAY+' '+NOWT,who:ui.user,text:'按鉴定结果分笼 → '+to+(dest?'（手动指定）':''),cls:''});
  if(r){r.moved=true;r.target=to;} // 行标记已分笼：复选框禁用、目标笼定格
 });
 OPLOG.unshift({t:NOWT,text:'基因型分笼：'+ids.join('、')+(dest?' → '+dest+'（手动指定）':'')+' · '+ui.user});
 // 整批可分行全部移入完毕 → 批状态定格为「分笼完成」，隐藏分笼按钮
 if(b&&b.rows.every(r=>r.moved||genoLabel(r)==='无效'))b.status='分笼完成';
 ui.gsel.clear();render();toast('✓ 已生成换笼记录（按鉴定结果分笼）');
}

 });

 });

  if(ui.statOldOpen)sOlder.forEach(x=>h+=statRow(x));
 }
 h+='</table><div class="smaller mut">除零保护：期间在养数为 0 时显示「—」。撤销的记录（误判复活）已从统计剔除。所有终态记录（含完整登记与已归因）均可撤回，撤回后鼠恢复在养、死亡率与伦理用量同步回退，全程留痕。30 天前的旧记录默认收纳。</div></div>';
 // 2 性别比（动态：ident 基线 + 实时鉴定叠加）
 h+='<div class="grid2"><div class="card"><h3>2) 基因型性别比 <span class="rt">有效鉴定 × 建档性别</span></h3>';
 h+='<table><tr><th>繁育对</th><th>基因型</th><th>公</th><th>母</th><th>占比</th></tr>';
 let totalIdent=0,totalRows=0;
 Object.entries(PAIRS).forEach(([bp,p])=>{
  const cnt=pairCount(p);
  const n=cnt.HE[0]+cnt.HE[1]+cnt.WT[0]+cnt.WT[1];
  if(!n)return;
  totalIdent+=n;
  [['H（HE）',cnt.HE],['WT',cnt.WT]].forEach(([g,[mm,ff]])=>{
   if(mm+ff===0)return;
   totalRows++;
   h+='<tr><td>'+bp+'</td><td>'+g+'</td><td>'+mm+'</td><td>'+ff+'</td><td>'+Math.round(mm/(mm+ff)*1000)/10+'% 公</td></tr>';
  });
 });
 if(!totalRows)h+='<tr><td colspan="5" class="smaller mut">暂无有效鉴定数据</td></tr>';
 h+='</table><div class="smaller mut">合计已鉴定 '+totalIdent+' 只（含基线历史鉴定与实时录入）· 鉴定「无效」不计入分母（S-7）。X 连锁传递或性别致死偏离可直接可见。</div></div>';
 // 3 HE/WT（动态：偏离期望 1:1 相对偏差超 1/3 即预警）
 h+='<div class="card"><h3>3) HE/WT 比例 · 孟德尔期望对比 <span class="rt">杂合×WT 期望 1:1</span></h3>';
 let hwShown=0;
 Object.entries(PAIRS).forEach(([bp,p])=>{
  const cnt=pairCount(p);
  const he=cnt.HE[0]+cnt.HE[1],wt=cnt.WT[0]+cnt.WT[1],n=he+wt;
  if(!n)return;
  hwShown++;
  const pHE=Math.round(he/n*1000)/10;
  const kind=(Math.abs(he/n-0.5)/0.5>1/3)?'warn':'ok';
  const banner=kind==='warn'?'⚠ HE 占比 '+pHE+'%，偏离期望 50% 超过阈值（相对偏差 1/3）· 可能原因：纯合致死 / 鉴定错误 / 样本偏倚 · 建议核查送检记录（只提示不阻断）':'';
  h+=hwCard('繁育对 '+bp+'（'+M[p.sire].geno+' × '+p.dams.map(d=>M[d]?M[d].geno:'?').join('/')+'）',n,he,wt,kind,banner);
 });
 if(!hwShown)h+='<div class="smaller mut">暂无有效鉴定数据</div>';
 h+='</div></div>';
 return h;
}
function pairCount(p){
 const cnt={HE:[0,0],WT:[0,0]};
 if(p.ident){cnt.HE=p.ident.HE.slice();cnt.WT=p.ident.WT.slice();}
 pairOffspring(p).forEach(m=>{cnt[genoClass(m.geno)][m.sex==='♂'?0:1]++;});
 return cnt;
}
function hwCard(title,n,he,wt,kind,banner){
 const pHE=Math.round(he/n*1000)/10,pWT=Math.round(wt/n*1000)/10;
 return '<div class="card" style="background:#fbfcfe;margin-bottom:10px;"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;"><b>'+title+'</b>'
 +'<span class="tag '+(kind==='ok'?'ok':'amber')+'">'+(kind==='ok'?'✓ 符合期望':'⚠ 比例偏离')+'</span></div>'
 +'<div class="small mut">已鉴定 '+n+' 只 · 期望 HE : WT = 1 : 1</div>'
 +'<div class="small" style="margin-top:6px;">HE（H）· '+he+' 只 · '+pHE+'%</div><div class="bar"><i class="'+(kind==='warn'?'amber':'')+'" style="width:'+pHE+'%;"></i></div>'
 +'<div class="small" style="margin-top:4px;">WT · '+wt+' 只 · '+pWT+'%</div><div class="bar"><i class="gray" style="width:'+pWT+'%;"></i></div>'
 +(banner?'<div class="banner b-amber">'+banner+'</div>':'')+'</div>';
}

/* ================= 启动 ================= */
loadData(); // 启动时先恢复上次保存的数据，再渲染
render();
document.querySelector('.side a').classList.add('on');
</script>
